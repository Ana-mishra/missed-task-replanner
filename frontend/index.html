<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Missed Task Replanner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the last-known theme before first paint to avoid a
      // light-theme flash. The server value from /settings remains the
      // source of truth and reconciles on load.
      try {
        var cachedTheme = localStorage.getItem('planora.theme') || 'light';
        var resolved = cachedTheme === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (cachedTheme === 'dark' ? 'dark' : 'light');
        document.documentElement.dataset.theme = resolved;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
